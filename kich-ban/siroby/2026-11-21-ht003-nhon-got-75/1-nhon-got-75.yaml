    ten: vong-4-khong-doi-dong-tac
  - lam: ngoiXomSau
    giu_giay: 10
  - ghi_nhan: { chu: "động tác đủ", toi_da: 40 }
    ten: vong-4-dong-tac-du
  - ghi_nhan: { chu: "CHƠI LẠI", toi_da: 40 }
